# Publishes this package to PyPI. Written into this repository by Lurk's release job; do not edit it here (the next release overwrites it).
#
# - It runs only on a version tag, and only the release job can create one (a tag ruleset). A person approves the `publish` environment.
# - There is no PyPI token anywhere: PyPI trusted publishing (OpenID Connect) gives the publish step a credential for this run only, and
#   the package is published with attestations that say where it was built.
# - The package is built and tested once, in a job with no way to publish; the `publish` job uploads exactly those files.
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # A tag made through the API does not always start the push trigger above (the first release's did not). Run this workflow by hand
  # from the mirror's Actions tab, choosing the version tag as the ref: the build refuses any ref that is not the package's own tag.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not the package version ${VERSION}." >&2
            exit 1
          fi
      - name: The files are the ones the release job exported
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          record = json.loads(pathlib.Path(".lurk-export.json").read_text())
          bad = [f["path"] for f in record["files"] if hashlib.sha256(pathlib.Path(f["path"]).read_bytes()).hexdigest() != f["sha256"]]
          listed = {f["path"] for f in record["files"]} | {".lurk-export.json"}
          extra = [str(p) for p in pathlib.Path(".").rglob("*") if p.is_file() and ".git" not in p.parts and str(p) not in listed]
          if bad or extra:
              print("Changed since the export:", bad, "Not in the export:", extra, file=sys.stderr)
              sys.exit(1)
          if record["version"] != os.environ["GITHUB_REF_NAME"][1:]:
              print("The export is for another version.", file=sys.stderr)
              sys.exit(1)
          PY
      - run: python -m unittest discover -s tests -t .
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python -m pip install --disable-pip-version-check build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
